<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tokyo Map Lab — 東京の面白くてためになる地図</title>
<meta property="og:title" content="Tokyo Map Lab — 東京の面白くてためになる地図">
<meta property="og:description" content="家賃コスパ路線図、東京再開発3Dマップなど、東京の「面白くてためになる」地図をつくる実験室。">
<meta property="og:image" content="https://shunkoala.github.io/tokyo-map-lab/assets/og-redev.jpg">
<meta property="og:url" content="https://shunkoala.github.io/tokyo-map-lab/">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #f8f9fa; color: #202124; min-height: 100vh;
    font-family: Roboto, system-ui, -apple-system, "Segoe UI", "Hiragino Sans", "Noto Sans JP", sans-serif;
    display: flex; flex-direction: column; align-items: center; padding: 8vh 24px 40px;
  }
  h1 { font-size: 30px; letter-spacing: .02em; }
  .sub { color: #5f6368; font-size: 14px; margin: 10px 0 40px; text-align: center; line-height: 1.7; }
  .cards { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; max-width: 860px; }
  a.card {
    display: block; width: 380px; background: #fff; border: 1px solid rgba(60,64,67,.16);
    border-radius: 16px; padding: 26px 26px 22px; text-decoration: none; color: inherit;
    box-shadow: 0 1px 2px rgba(60,64,67,.3), 0 1px 3px 1px rgba(60,64,67,.15);
    transition: transform .15s, box-shadow .15s;
  }
  a.card:hover { transform: translateY(-3px); box-shadow: 0 8px 24px rgba(60,64,67,.25); }
  .emoji { font-size: 40px; }
  .card h2 { font-size: 18px; margin: 12px 0 8px; }
  .card p { color: #5f6368; font-size: 13px; line-height: 1.7; }
  .badge { display: inline-block; margin-top: 14px; color: #1a73e8; font-size: 13px; font-weight: 700; }
  footer { margin-top: auto; padding-top: 50px; color: #80868b; font-size: 11px; text-align: center; line-height: 1.7; }
  footer a { color: #80868b; }
</style>
</head>
<body>
  <h1>🗼 Tokyo Map Lab</h1>
  <div class="sub">東京の「面白くてためになる」地図をつくる実験室。<br>データはすべて公開情報をもとにした目安です。</div>
  <div class="cards">
    <a class="card" href="./rent/">
      <div class="emoji">💴</div>
      <h2>家賃コスパ路線図</h2>
      <p>駅の位置を「家賃の高さ」で歪ませたインタラクティブ路線図。都心に近いのに安い駅ほど外へ飛び出します。穴場駅ランキング付き。</p>
      <span class="badge">地図を見る →</span>
    </a>
    <a class="card" href="./redev/">
      <div class="emoji">🏗️</div>
      <h2>東京再開発 3Dマップ</h2>
      <p>Torch Towerから築地スタジアム構想まで、都心の主要再開発を3Dで一望。年スライダーを動かすと未来のビルが生えてきます。</p>
      <span class="badge">地図を見る →</span>
    </a>
  </div>
  <footer>
    Tokyo Map Lab / データ出典は各マップのフッターに記載 / <a href="https://github.com/shunkoala/tokyo-map-lab">GitHub</a>
  </footer>
</body>
</html>
